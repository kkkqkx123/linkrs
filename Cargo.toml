[workspace]
resolver = "2"
members = [
    ".",
    "crates/linkrs-core",
    "crates/linkrs-config",
    "crates/linkrs-metrics",
    "crates/linkrs-fulltext",
    "crates/linkrs-sync",
    "crates/linkrs-transaction",
    "crates/linkrs-storage",
    "crates/linkrs-query",
    "crates/linkrs-grammar",
    "crates/linkrs-wire",
    "crates/linkrs-api",
    "crates/linkrs-server",
    "crates/linkrs-migration",
    "crates/vector-client",
    "crates/simvec",
    "crates/linkrs-cli",
    "crates/linkrs-client",
    "crates/linkrs-migration-cli",
    "crates/linkrs-gpui",
]

[patch.crates-io]
# The fork's only modified crate is the main one (configurable BM25 params,
# see crates/tantivy/PATCHES.md); it publishes under the `kkkqkx-` prefix.
# Unmodified sub-crates stay on their crates.io originals. The local fork is
# consumed by patching the renamed package to the sibling checkout.
kkkqkx-tantivy = { path = "crates/tantivy" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
authors = ["Linkrs Contributors"]
license = "Apache-2.0"
repository = "https://github.com/kkkqkx123/linkrs"
homepage = "https://github.com/kkkqkx123/linkrs"

[workspace.dependencies]
# serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
utoipa = "5.5"

# error handling
thiserror = "2.0.17"
anyhow = "1.0"

# logging / tracing
log = "0.4.29"
tracing = "0.1"
flexi_logger = { version = "0.31", features = ["async"] }

# concurrency
parking_lot = "0.12"
dashmap = "6.1"
crossbeam-utils = "0.8"
rayon = "1.10.0"

# async runtime
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# data & time
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.27.0", features = ["v4", "v7"] }

# text processing
regex = "1.11.1"

# random
rand = "0.8.5"

# compression & encoding
crc32fast = "1.5"
zstd = "0.14"
postcard = { version = "1.1", features = ["use-std"] }
criterion = { version = "0.5", features = ["async_tokio"] }
bitvec = "1.0"

# memory
bumpalo = "3.16"
compact_str = { version = "0.8", features = ["serde"] }

# numeric
dec = "0.4.11"

# caching
moka = { version = "0.12", features = ["sync", "future"] }
once_cell = "1.20"
memmap2 = "0.9.5"

# lock-free concurrency
arc-swap = "1.7"

# CLI
clap = { version = "4.5", features = ["derive"] }

# configuration
toml = "1.1"

# system
num_cpus = "1.17.0"
sysinfo = "0.30"
libc = "0.2"
sha2 = "0.10"
fs4 = "0.13"

# security
bcrypt = "0.18.0"

# HTTP / networking
reqwest = { version = "0.13", features = ["json", "query", "socks"] }
url = "2.5"

# (optional) HTTP server stack
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "limit"] }
http = "1.1"

# (optional) gRPC stack
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
prost-build = "0.13"

# (optional) SQL database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }

# CLI tools
rustyline = { version = "14.0", features = ["derive"] }
tabled = "0.22"
colored = "2.1"
dirs = "6.0"
rpassword = "7.3"
csv = "1.3"
glob = "0.3"

# build-time
cc = "1.2"

# tree-sitter syntax layer (linkrs-grammar)
tree-sitter = "0.27.1"
tree-sitter-language = "0.1.9"

# dev-deps shared across sub-crates
tempfile = "3.23.0"
serial_test = "3.0"

[package]
name = "linkrs"
version.workspace = true
edition.workspace = true
description = "A lightweight single-node graph database implemented in Rust"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
autobenches = false

[lib]
name = "linkrs"
crate-type = ["rlib"]

[[bin]]
name = "linkrs-server"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
linkrs-core = { version = "0.1.0", path = "crates/linkrs-core" }
linkrs-metrics = { version = "0.1.0", path = "crates/linkrs-metrics" }
linkrs-config = { version = "0.1.0", path = "crates/linkrs-config" }
linkrs-fulltext = { version = "0.1.0", path = "crates/linkrs-fulltext" }
linkrs-sync = { version = "0.1.0", path = "crates/linkrs-sync" }
linkrs-transaction = { version = "0.1.0", path = "crates/linkrs-transaction" }
linkrs-storage = { version = "0.1.0", path = "crates/linkrs-storage" }
linkrs-query = { version = "0.1.0", path = "crates/linkrs-query" }
linkrs-api = { version = "0.1.0", path = "crates/linkrs-api" }
linkrs-server = { version = "0.1.0", path = "crates/linkrs-server" }
linkrs-migration = { version = "0.1.0", path = "crates/linkrs-migration" }
clap.workspace = true
flexi_logger.workspace = true
tracing.workspace = true
tokio.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
rand.workspace = true
vector-client = { version = "0.1.0", path = "crates/vector-client", optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "psapi", "sysinfoapi", "fileapi", "minwinbase"] }

[features]
default = ["server", "vector"]
server = ["linkrs-config/server"]
# fulltext stays opt-in (not in default): it pulls the tantivy stack and
# grows the default build, while the placeholder bench keeps both run modes
# usable without the feature.
fulltext = ["linkrs-api/fulltext", "linkrs-server/fulltext", "linkrs-fulltext/fulltext", "linkrs-sync/fulltext"]
jieba = ["linkrs-fulltext/jieba"]
vector = ["linkrs-api/vector", "linkrs-server/vector", "linkrs-config/vector", "linkrs-sync/vector", "linkrs-query/vector"]
embedding = ["vector", "linkrs-sync/embedding", "linkrs-server/embedding"]
rerank = ["vector", "linkrs-sync/rerank", "linkrs-server/rerank"]
vector-qdrant = ["vector", "dep:vector-client", "linkrs-api/vector-qdrant", "linkrs-server/vector-qdrant", "linkrs-config/vector-qdrant", "linkrs-sync/vector-qdrant", "linkrs-query/vector-qdrant"]
grpc = ["linkrs-server/grpc"]
embedded = ["linkrs-api/embedded", "linkrs-api/c_api", "linkrs-config/embedded"]
c_api = ["linkrs-api/embedded", "linkrs-api/c_api", "linkrs-config/embedded"]

[profile.dev]
opt-level = 0
debug = true
codegen-units = 64

[dev-dependencies]
futures.workspace = true
tokio-test = "0.4.4"
serial_test = "3.0"
rayon.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
async-trait = "0.1"
dashmap.workspace = true
log = "0.4"
regex = "1"
toml = "1.1"
reqwest = { version = "0.13", features = ["json"] }
postcard.workspace = true
linkrs-wire = { version = "0.1.0", path = "crates/linkrs-wire" }
linkrs-storage = { version = "0.1.0", path = "crates/linkrs-storage", features = ["test-support"] }
