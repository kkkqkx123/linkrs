[package]
name = "linkrs-sync"
version.workspace = true
edition.workspace = true
description = "Synchronization primitives for Linkrs"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Built-in local vector engine. Enables the `vector_sync` module and
# `VectorBackend::Local`.
vector = ["dep:simvec"]
# Embedding infrastructure, independent of remote backend.
embedding = ["vector", "dep:llm-embedding", "dep:llm-token", "linkrs-config/embedding"]
# Post-recall rerank stage, independent of embedding.
rerank = ["vector", "dep:llm-rerank", "linkrs-config/rerank"]
# Remote qdrant client on top of the local engine types.
vector-qdrant = ["vector", "dep:vector-client", "linkrs-config/vector-qdrant"]
# Transport-layer sub-features for the remote client. They are additive on
# top of `vector-qdrant`; enabling both compiles in HTTP + gRPC.
vector-http = ["vector-qdrant", "vector-client/qdrant-http"]
vector-grpc = ["vector-qdrant", "vector-client/qdrant-grpc"]
fulltext = ["dep:linkrs-fulltext", "linkrs-fulltext/fulltext"]

[dependencies]
linkrs-core = { version = "0.1.0", path = "../linkrs-core" }
linkrs-metrics = { version = "0.1.0", path = "../linkrs-metrics" }
linkrs-fulltext = { version = "0.1.0", path = "../linkrs-fulltext", optional = true }
linkrs-config = { version = "0.1.0", path = "../linkrs-config" }
llm-embedding = { version = "0.1.0", package = "llm-suite-embedding", path = "../llm-suite/crates/llm-suite-embedding", optional = true }
llm-rerank = { version = "0.1.0", package = "llm-suite-rerank", path = "../llm-suite/crates/llm-suite-rerank", optional = true }
llm-token = { version = "0.1.0", package = "llm-suite-token", path = "../llm-suite/crates/llm-suite-token", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
vector-client = { version = "0.1.0", path = "../vector-client", features = ["qdrant-grpc", "qdrant-http"], optional = true }
simvec = { version = "0.1.0", path = "../simvec", optional = true }
tracing.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
sqlx.workspace = true
postcard.workspace = true
crc32fast.workspace = true

[dev-dependencies]
tempfile.workspace = true