[package]
name = "graphdb-query"
version.workspace = true
edition.workspace = true

[dependencies]
graphdb-core = { path = "../graphdb-core" }
graphdb-storage = { path = "../graphdb-storage" }
graphdb-migration = { path = "../graphdb-migration" }
graphdb-fulltext = { path = "../graphdb-fulltext" }
graphdb-sync = { path = "../graphdb-sync" }
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
zstd.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
rand.workspace = true
rayon.workspace = true
csv.workspace = true
dashmap.workspace = true
bitvec.workspace = true
futures.workspace = true
tokio.workspace = true
moka.workspace = true
vector-search = { path = "../vector-search", optional = true }

[features]
vector = ["dep:vector-search", "graphdb-sync/vector"]
vector-qdrant = ["vector", "graphdb-sync/vector-qdrant"]
fulltext = ["graphdb-fulltext/fulltext", "graphdb-sync/fulltext"]

[dev-dependencies]
graphdb-storage = { path = "../graphdb-storage", features = ["test-support"] }
tempfile.workspace = true
