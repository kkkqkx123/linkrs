[package]
name = "linkrs-fulltext"
version.workspace = true
edition.workspace = true
description = "Full-text search engine based on BM25 and Tantivy"
license.workspace = true
repository.workspace = true
homepage.workspace = true
autobenches = false

[dependencies]
linkrs-core = { version = "0.1.0", path = "../linkrs-core" }
linkrs-metrics = { version = "0.1.0", path = "../linkrs-metrics" }
linkrs-config = { version = "0.1.0", path = "../linkrs-config" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
chrono.workspace = true
tantivy = { version = "0.27.0", package = "kkkqkx-tantivy", optional = true }
jieba-rs = { version = "0.10", optional = true }
tantivy-tokenizer-api = { version = "0.7", optional = true }
dashmap.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs"] }

[features]
# `fulltext` stays opt-in instead of default: the tantivy backend roughly
# doubles the default build closure, while the bench placeholder warns loudly
# when the feature is off (see benches/fulltext_bench.rs). Opt in explicitly
# with `--features fulltext`.
fulltext = ["dep:tantivy"]
jieba = ["dep:jieba-rs", "dep:tantivy-tokenizer-api"]

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
linkrs-sync = { version = "0.1.0", path = "../linkrs-sync", features = ["fulltext"] }

[[bench]]
name = "fulltext_bench"
harness = false
