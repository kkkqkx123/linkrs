[package]
name = "linkrs-fulltext"
version.workspace = true
edition.workspace = true
description = "Full-text search engine based on BM25 and Tantivy"
license.workspace = true

[dependencies]
linkrs-core = { path = "../linkrs-core" }
linkrs-metrics = { path = "../linkrs-metrics" }
linkrs-config = { path = "../linkrs-config" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
chrono.workspace = true
tantivy = { version = "0.27.0", optional = true }
jieba-rs = { version = "0.10", optional = true }
tantivy-tokenizer-api = { version = "0.7", optional = true }
dashmap.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs"] }

[features]
fulltext = ["dep:tantivy"]
jieba = ["dep:jieba-rs", "dep:tantivy-tokenizer-api"]

[dev-dependencies]
tempfile.workspace = true
linkrs-sync = { path = "../linkrs-sync", features = ["fulltext"] }
