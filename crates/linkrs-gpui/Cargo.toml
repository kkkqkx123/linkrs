[package]
name = "linkrs-gpui"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Linkrs native desktop client built on GPUI"
license.workspace = true
publish = false

[dependencies]
# Consumed as a git dependency because cargo resolves `{ workspace = true }`
# inheritance of path dependencies against the consuming workspace root, which
# cannot provide gpui-kit's private dependency table. The checkout under
# crates/gpui-kit (submodule) mirrors this revision for local development.
gpui-kit = { git = "https://github.com/kkkqkx123/gpui-kit", branch = "feat/compograph", default-features = false, features = ["component", "assets", "syntect"] }
linkrs-client = { path = "../linkrs-client" }
linkrs-wire = { path = "../linkrs-wire" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
csv.workspace = true
directories = "6"
env_logger = "0.11"
toml = "0.9"
