[package]
name = "linkrs-gpui"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Linkrs native desktop client built on GPUI"
license.workspace = true
publish = false

[dependencies]
# Consumed as a local path dependency: crates/gpui-kit (submodule) is the
# source of truth, never a remote. gpui-kit has its own workspace root, so its
# internal `workspace = true` inheritance resolves against crates/gpui-kit,
# not against the linkrs workspace.
gpui-kit = { path = "../gpui-kit/crates/kit", default-features = false, features = ["component", "assets", "syntect"] }
linkrs-client = { path = "../linkrs-client" }
linkrs-wire = { path = "../linkrs-wire" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
csv.workspace = true
directories = "6"
env_logger = "0.11"
toml = "0.9"
