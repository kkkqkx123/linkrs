[package]
name = "linkrs-gpui"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
description = "Linkrs native desktop client built on GPUI"
license.workspace = true
publish = false

[workspace]
# Own workspace root: this crate is intentionally NOT a member of the linkrs
# root workspace. Two independent blockers force the split:
# 1. Nested-workspace inheritance: Cargo resolves `workspace = true` of an
#    in-tree path dependency against the consuming workspace root (verified
#    by probe; `exclude` does not change it for root-package workspaces, and
#    `[patch]` paths behave the same), so a path from the root workspace into
#    crates/gpui-kit fails on its private entries (`gpui = gpui-pre`,
#    edition 2024, lints table). Mirroring those entries into the root
#    workspace is rejected by design (key/version conflicts, see
#    docs/plan/gpui_client_implementation_plan.md section 1.1).
# 2. `links` conflict: gpui-component pins tree-sitter 0.26 while
#    linkrs-grammar pins tree-sitter 0.27, and both declare
#    `links = "tree-sitter"`, so no single lockfile can contain both.
# From here `../gpui-kit` is outside this workspace directory, so gpui-kit
# keeps resolving against its own workspace root, while `../linkrs-client`
# and `../linkrs-wire` keep resolving against the linkrs root. All sources
# are local submodule checkouts: local builds never fetch git.
# Build with `cargo build --manifest-path crates/linkrs-gpui/Cargo.toml`
# (or plain `cargo build` inside this directory). The `crates/gpui-kit`
# submodule must be initialized first:
# `git submodule update --init crates/gpui-kit`.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Mirrors the linkrs root specs for the crates.io deps used here, so both
# workspaces resolve compatible versions. Bumps should stay in sync.
anyhow = "1.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
futures = "0.3"
csv = "1.3"

[dependencies]
# Local vendored sources only (see [workspace] above for why).
# `tree-sitter-sql` adds tree-sitter-based SQL highlighting (folding,
# syntax-aware editing) on top of the lighter syntect fallback used by
# `.language("sql")` on the query editor.
gpui-kit = { path = "../gpui-kit/crates/kit", default-features = false, features = ["component", "assets", "syntect", "tree-sitter-sql"] }
# Native graph rendering (compograph). These crates share the gpui-pre
# =0.3.10 pin with gpui-kit (see the compograph workspace Cargo.toml);
# both workspaces resolve one GPUI API baseline, so views and canvases
# share entity and element types. The compograph submodule must be
# initialized (`git submodule update --init --recursive crates/gpui-kit`).
compograph-graph = { path = "../gpui-kit/crates/compograph/crates/foundation/cg-graph" }
compograph-layout = { path = "../gpui-kit/crates/compograph/crates/engine/cg-layout" }
compograph-render = { path = "../gpui-kit/crates/compograph/crates/render/cg-render" }
compograph-interact = { path = "../gpui-kit/crates/compograph/crates/render/cg-interact" }
compograph-types = { path = "../gpui-kit/crates/compograph/crates/foundation/cg-types" }
compograph-geometry = { path = "../gpui-kit/crates/compograph/crates/foundation/cg-geometry" }
linkrs-client = { path = "../linkrs-client" }
linkrs-wire = { path = "../linkrs-wire" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
csv.workspace = true
directories = "6"
env_logger = "0.11"
toml = "0.9"

# Keep the GPUI render loop (text shaping, layout, SVG decoding, networking)
# usable in debug builds: these crates are unusably slow when unoptimized.
# Mirrors the tuned set from the gpui-kit workspace, restricted to packages
# that actually appear in our lock (the gpui-pre snapshot splits its crates
# differently from the upstream gpui-kit main branch).
[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-linux = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }
