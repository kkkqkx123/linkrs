[package]
name = "linkrs-config"
version.workspace = true
edition.workspace = true
description = "Configuration management for Linkrs"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
linkrs-core = { version = "0.1.0", path = "../linkrs-core" }
linkrs-metrics = { version = "0.1.0", path = "../linkrs-metrics" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
log.workspace = true
dirs.workspace = true
rand.workspace = true
llm-embedding = { version = "0.1.0", package = "llm-suite-embedding", path = "../llm-suite/crates/llm-suite-embedding", optional = true }
llm-rerank = { version = "0.1.0", package = "llm-suite-rerank", path = "../llm-suite/crates/llm-suite-rerank", optional = true }
flexi_logger.workspace = true
parking_lot.workspace = true

[features]
server = []
embedded = []
vector = []
embedding = ["dep:llm-embedding"]
rerank = ["dep:llm-rerank"]
vector-qdrant = ["vector"]

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
