[package]
name = "linkrs-server"
version.workspace = true
edition.workspace = true
description = "Linkrs network service layer (HTTP/gRPC)"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[build-dependencies]
tonic-build = { workspace = true, optional = true }

[dependencies]
linkrs-core = { path = "../linkrs-core" }
linkrs-config = { path = "../linkrs-config", features = ["server"] }
linkrs-metrics = { path = "../linkrs-metrics" }
linkrs-storage = { path = "../linkrs-storage" }
linkrs-query = { path = "../linkrs-query" }
linkrs-wire = { path = "../linkrs-wire" }
linkrs-transaction = { path = "../linkrs-transaction" }
linkrs-sync = { path = "../linkrs-sync" }
linkrs-fulltext = { path = "../linkrs-fulltext" }
linkrs-migration = { path = "../linkrs-migration" }
linkrs-api = { path = "../linkrs-api" }

serde.workspace = true
serde_json.workspace = true
csv.workspace = true
rand.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tracing.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v4"] }
regex.workspace = true
sysinfo.workspace = true
crc32fast.workspace = true

axum = { workspace = true, features = ["multipart"] }
tower.workspace = true
tower-http.workspace = true
http.workspace = true
utoipa = { workspace = true }
sqlx.workspace = true
async-trait.workspace = true

tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
vector-client = { path = "../vector-client", optional = true }
simvec = { path = "../simvec", optional = true }
llm-embedding = { path = "../llm-suite/crates/llm-embedding", optional = true }
reqwest = { workspace = true, optional = true }

[features]
grpc = ["dep:tonic", "dep:prost", "dep:tonic-build"]
vector = [
    "dep:simvec",
    "linkrs-config/vector",
    "linkrs-sync/vector",
    "linkrs-query/vector",
    "linkrs-api/vector",
]
embedding = [
    "vector",
    "dep:llm-embedding",
    "linkrs-sync/embedding",
]
vector-qdrant = [
    "vector",
    "embedding",
    "dep:vector-client",
    "dep:reqwest",
    "linkrs-config/vector-qdrant",
    "linkrs-sync/vector-qdrant",
    "linkrs-query/vector-qdrant",
    "linkrs-api/vector-qdrant",
]
fulltext = [
    "linkrs-fulltext/fulltext",
    "linkrs-sync/fulltext",
    "linkrs-query/fulltext",
    "linkrs-api/fulltext",
]

[dev-dependencies]
linkrs-storage = { path = "../linkrs-storage", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
