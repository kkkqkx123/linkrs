[package]
name = "linkrs-storage"
version.workspace = true
edition.workspace = true
description = "Storage engine with CSR and memory-mapped containers"
license.workspace = true
autobenches = false

[features]
default = []
test-support = []
fulltext = ["linkrs-sync/fulltext", "linkrs-fulltext"]

[dependencies]
linkrs-core = { path = "../linkrs-core" }
linkrs-metrics = { path = "../linkrs-metrics" }
linkrs-transaction = { path = "../linkrs-transaction" }
linkrs-sync = { path = "../linkrs-sync" }
linkrs-fulltext = { path = "../linkrs-fulltext", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
chrono.workspace = true
uuid.workspace = true
crc32fast.workspace = true
zstd.workspace = true
memmap2.workspace = true
bumpalo.workspace = true
postcard.workspace = true
bitvec.workspace = true
dec.workspace = true
rayon.workspace = true
rand.workspace = true
tracing.workspace = true
arc-swap.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
linkrs-config = { path = "../linkrs-config" }

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "csr_perf_bench"
harness = false

[[bench]]
name = "neighbor_batch_bench"
harness = false

[[bench]]
name = "edge_property_tables_bench"
harness = false

[[bench]]
name = "ingest_bench"
harness = false

[[bench]]
name = "commit_gate_bench"
harness = false

[[bench]]
name = "edge_scan_speedup_bench"
harness = false

[[bench]]
name = "edge_read_alloc_bench"
harness = false

[[bench]]
name = "storage_read_baseline"
harness = false

[[bench]]
name = "wal_bench"
harness = false

[[bench]]
name = "crash_recovery_bench"
harness = false

[[bench]]
name = "rollback_bench"
harness = false

[[bench]]
name = "storage_workflow_bench"
harness = false
