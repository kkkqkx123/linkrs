license.workspace = true

[features]
default = []
test-support = []
fulltext = ["linkrs-sync/fulltext", "linkrs-fulltext"]

[dependencies]
linkrs-core = { path = "../linkrs-core" }
linkrs-metrics = { path = "../linkrs-metrics" }
linkrs-transaction = { path = "../linkrs-transaction" }
linkrs-sync = { path = "../linkrs-sync" }
linkrs-fulltext = { path = "../linkrs-fulltext", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
chrono.workspace = true
uuid.workspace = true
crc32fast.workspace = true
zstd.workspace = true
memmap2.workspace = true
bumpalo.workspace = true
postcard.workspace = true
bitvec.workspace = true
dec.workspace = true
rayon.workspace = true
rand.workspace = true
tracing.workspace = true
arc-swap.workspace = true

[dev-dependencies]
tempfile.workspace = true
linkrs-config = { path = "../linkrs-config" }
