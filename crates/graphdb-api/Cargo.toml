[package]
name = "graphdb-api"
version.workspace = true
edition.workspace = true

[dependencies]
graphdb-core = { path = "../graphdb-core" }
graphdb-config = { path = "../graphdb-config" }
graphdb-storage = { path = "../graphdb-storage" }
graphdb-query = { path = "../graphdb-query" }
graphdb-transaction = { path = "../graphdb-transaction" }
graphdb-sync = { path = "../graphdb-sync" }
graphdb-search = { path = "../graphdb-search" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
parking_lot.workspace = true
vector-client = { path = "../vector-client", optional = true }
vector-search = { path = "../vector-search", optional = true }

[features]
vector = [
    "dep:vector-search",
    "graphdb-config/vector",
    "graphdb-sync/vector",
    "graphdb-query/vector",
]
vector-qdrant = [
    "vector",
    "dep:vector-client",
    "graphdb-config/vector-qdrant",
    "graphdb-sync/vector-qdrant",
    "graphdb-query/vector-qdrant",
]
fulltext-search = [
    "graphdb-search/fulltext-search",
    "graphdb-sync/fulltext-search",
    "graphdb-query/fulltext-search",
]
c_api = []
embedded = []

[dev-dependencies]
graphdb-storage = { path = "../graphdb-storage", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
