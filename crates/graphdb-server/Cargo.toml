[package]
name = "graphdb-server"
version.workspace = true
edition.workspace = true
description = "GraphDB network service layer (HTTP/gRPC)"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[build-dependencies]
tonic-build = { workspace = true, optional = true }
prost-build = { workspace = true, optional = true }

[dependencies]
graphdb-core = { path = "../graphdb-core" }
graphdb-config = { path = "../graphdb-config", features = ["server"] }
graphdb-metrics = { path = "../graphdb-metrics" }
graphdb-storage = { path = "../graphdb-storage" }
graphdb-query = { path = "../graphdb-query" }
graphdb-wire = { path = "../graphdb-wire" }
graphdb-transaction = { path = "../graphdb-transaction" }
graphdb-sync = { path = "../graphdb-sync" }
graphdb-fulltext = { path = "../graphdb-fulltext" }
graphdb-migration = { path = "../graphdb-migration" }
graphdb-api = { path = "../graphdb-api" }

serde.workspace = true
serde_json.workspace = true
csv.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v4"] }
regex.workspace = true
sysinfo.workspace = true
crc32fast.workspace = true

axum = { workspace = true, features = ["multipart"] }
tower.workspace = true
tower-http.workspace = true
http.workspace = true
sqlx.workspace = true
async-trait.workspace = true

tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
vector-client = { path = "../vector-client", optional = true }
vector-search = { path = "../vector-search", optional = true }
graphdb-embedding = { path = "../graphdb-embedding", optional = true }
reqwest = { workspace = true, optional = true }

[features]
grpc = ["dep:tonic", "dep:prost", "dep:tonic-build", "dep:prost-build"]
vector = [
    "dep:vector-search",
    "graphdb-config/vector",
    "graphdb-sync/vector",
    "graphdb-query/vector",
    "graphdb-api/vector",
]
embedding = [
    "vector",
    "dep:graphdb-embedding",
    "graphdb-sync/embedding",
]
vector-qdrant = [
    "vector",
    "embedding",
    "dep:vector-client",
    "dep:reqwest",
    "graphdb-config/vector-qdrant",
    "graphdb-sync/vector-qdrant",
    "graphdb-query/vector-qdrant",
    "graphdb-api/vector-qdrant",
]
fulltext = [
    "graphdb-fulltext/fulltext",
    "graphdb-sync/fulltext",
    "graphdb-query/fulltext",
]

[dev-dependencies]
graphdb-storage = { path = "../graphdb-storage", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
