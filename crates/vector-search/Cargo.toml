[package]
name = "vector-search"
version.workspace = true
edition.workspace = true
description = "Local vector search engine: exact scan, mmap storage, WAL"

[lib]
name = "vector_search"
path = "src/lib.rs"

[features]
# Compile in adjacency/list write-lock wait instrumentation. Off by
# default so the hot mutation paths carry no timing overhead; enable for
# lock-contention investigations (metrics flow through MetricsSnapshot).
lock-metrics = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
rayon.workspace = true
memmap2.workspace = true
bitvec.workspace = true
arc-swap.workspace = true
tracing.workspace = true
chrono.workspace = true
crc32fast.workspace = true

[dev-dependencies]
tempfile.workspace = true
rand.workspace = true
criterion.workspace = true
rayon.workspace = true

[[bench]]
name = "vector_scan_bench"
harness = false

[[bench]]
name = "ivf_bench"
harness = false

[[bench]]
name = "hnsw_build_bench"
harness = false

[[bench]]
name = "hnsw_ingest_bench"
harness = false

[[bench]]
name = "concurrent_search_bench"
harness = false

[[bench]]
name = "alloc_stats_bench"
harness = false

[[bench]]
name = "persist_crc_bench"
harness = false
