[package]
name = "graphdb-sync"
version.workspace = true
edition.workspace = true

[features]
# Built-in local vector engine. Enables the `vector_sync` module and
# `VectorBackend::Local`.
vector = ["dep:vector-search"]
# Remote qdrant client on top of the local engine types.
vector-qdrant = ["vector", "dep:vector-client"]
fulltext-search = ["graphdb-search/fulltext-search"]

[dependencies]
graphdb-core = { path = "../graphdb-core" }
graphdb-search = { path = "../graphdb-search" }
graphdb-config = { path = "../graphdb-config" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
vector-client = { path = "../vector-client", features = ["qdrant-grpc"], optional = true }
vector-search = { path = "../vector-search", optional = true }
tracing.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
sqlx.workspace = true
postcard.workspace = true
crc32fast.workspace = true

[dev-dependencies]
tempfile.workspace = true