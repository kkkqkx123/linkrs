[package]
name = "linkrs-api"
version.workspace = true
edition.workspace = true
description = "Transport-independent core API for Linkrs"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
linkrs-core = { version = "0.1.0", path = "../linkrs-core" }
linkrs-config = { version = "0.1.0", path = "../linkrs-config" }
linkrs-storage = { version = "0.1.0", path = "../linkrs-storage" }
linkrs-query = { version = "0.1.0", path = "../linkrs-query" }
linkrs-transaction = { version = "0.1.0", path = "../linkrs-transaction" }
linkrs-sync = { version = "0.1.0", path = "../linkrs-sync" }
linkrs-fulltext = { version = "0.1.0", path = "../linkrs-fulltext" }
linkrs-migration = { version = "0.1.0", path = "../linkrs-migration" }
linkrs-metrics = { version = "0.1.0", path = "../linkrs-metrics" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
log.workspace = true
tracing.workspace = true
tokio.workspace = true
parking_lot.workspace = true
vector-client = { version = "0.1.0", path = "../vector-client", optional = true }
simvec = { version = "0.1.0", path = "../simvec", optional = true }

[features]
vector = [
    "dep:simvec",
    "linkrs-config/vector",
    "linkrs-sync/vector",
    "linkrs-query/vector",
]
vector-qdrant = [
    "vector",
    "dep:vector-client",
    "linkrs-config/vector-qdrant",
    "linkrs-sync/vector-qdrant",
    "linkrs-query/vector-qdrant",
]
fulltext = [
    "linkrs-fulltext/fulltext",
    "linkrs-sync/fulltext",
    "linkrs-query/fulltext",
]
c_api = ["embedded"]
embedded = []

[dev-dependencies]
linkrs-storage = { version = "0.1.0", path = "../linkrs-storage", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
