[package]
name = "linkrs-query"
version.workspace = true
edition.workspace = true
description = "Query engine, parser, and executor for Linkrs"
license.workspace = true
repository.workspace = true
homepage.workspace = true
autobenches = false

[dependencies]
linkrs-core = { version = "0.1.0", path = "../linkrs-core" }
linkrs-metrics = { version = "0.1.0", path = "../linkrs-metrics" }
linkrs-storage = { version = "0.1.0", path = "../linkrs-storage" }
linkrs-migration = { version = "0.1.0", path = "../linkrs-migration" }
linkrs-fulltext = { version = "0.1.0", path = "../linkrs-fulltext" }
linkrs-sync = { version = "0.1.0", path = "../linkrs-sync" }
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
zstd.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
rand.workspace = true
rayon.workspace = true
csv.workspace = true
glob.workspace = true
libloading = "0.8"
dashmap.workspace = true
bitvec.workspace = true
futures.workspace = true
tokio.workspace = true
moka.workspace = true
simvec = { version = "0.1.0", path = "../simvec", optional = true }

[features]
vector = ["dep:simvec", "linkrs-sync/vector"]
vector-qdrant = ["vector", "linkrs-sync/vector-qdrant"]
embedding = ["linkrs-sync/embedding"]
fulltext = ["linkrs-fulltext/fulltext", "linkrs-sync/fulltext"]

[dev-dependencies]
criterion.workspace = true
linkrs-storage = { version = "0.1.0", path = "../linkrs-storage", features = ["test-support"] }
tempfile.workspace = true

[[bench]]
name = "query_bench"
harness = false

[[bench]]
name = "query_stage_bench"
harness = false

[[bench]]
name = "traversal_perf_bench"
harness = false

[[bench]]
name = "parallel_scale_bench"
harness = false

[[bench]]
name = "olap_e2e_bench"
harness = false

[[bench]]
name = "executor_bench"
harness = false

[[bench]]
name = "columnar_probe_bench"
harness = false
