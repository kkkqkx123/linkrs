// Cold snapshot distribution between nodes.
//
// A primary node exports .lkcs files and pushes them (or serves pulls);
// read replicas receive the file, register it via load_cold_snapshot, and
// the query engine automatically falls back to the cold data.

syntax = "proto3";

package coldsnapshot;

// Metadata describing one .lkcs snapshot file.
message SnapshotDescriptor {
  uint32 label = 1;
  string label_name = 2;
  uint64 snapshot_ts = 3;
  uint64 edge_count = 4;
  string file_name = 5;
  uint64 file_size = 6;
  uint32 checksum = 7;
}

// Push a complete .lkcs file to a replica.
message PushSnapshotRequest {
  string file_name = 1;
  uint32 checksum = 2;
  bytes data = 3;
}

message PushSnapshotResponse {
  bool accepted = 1;
  string message = 2;
}

// Pull the snapshot of a label, optionally at a specific timestamp
// (latest when omitted).
message PullSnapshotRequest {
  uint32 label = 1;
  optional uint64 snapshot_ts = 2;
}

// Streaming file chunk. The receiver reassembles by offset and verifies the
// final CRC32.
message SnapshotChunk {
  string file_name = 1;
  uint32 checksum = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool last = 5;
}

message ListSnapshotsRequest {}

message ListSnapshotsResponse {
  repeated SnapshotDescriptor snapshots = 1;
}

service ColdSnapshotService {
  rpc PushSnapshot(PushSnapshotRequest) returns (PushSnapshotResponse);
  rpc PullSnapshot(PullSnapshotRequest) returns (stream SnapshotChunk);
  rpc ListRemoteSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
}
