syntax = "proto3";

package linkrs;

// Linkrs Service Definition
service LinkrsService {
  // Health Check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  
  // Authentication
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  
  // Session Management
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  
  // Query Execution
  rpc ExecuteQuery(ExecuteQueryRequest) returns (ExecuteQueryResponse);
  rpc ValidateQuery(ValidateQueryRequest) returns (ValidateQueryResponse);
  rpc ExecuteQueryStream(ExecuteQueryRequest) returns (stream StreamResponse);
  
  // Transaction Management
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);
  rpc CreateSavepoint(CreateSavepointRequest) returns (CreateSavepointResponse);
  rpc RollbackToSavepoint(RollbackToSavepointRequest) returns (RollbackToSavepointResponse);
  rpc ReleaseSavepoint(ReleaseSavepointRequest) returns (ReleaseSavepointResponse);
  
  // Schema Management - Space
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse);
  rpc GetSpace(GetSpaceRequest) returns (GetSpaceResponse);
  rpc DropSpace(DropSpaceRequest) returns (DropSpaceResponse);
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  
  // Schema Management - Tag
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc GetTag(GetTagRequest) returns (GetTagResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc DropTag(DropTagRequest) returns (DropTagResponse);
  
  // Schema Management - Edge Type
  rpc CreateEdgeType(CreateEdgeTypeRequest) returns (CreateEdgeTypeResponse);
  rpc GetEdgeType(GetEdgeTypeRequest) returns (GetEdgeTypeResponse);
  rpc ListEdgeTypes(ListEdgeTypesRequest) returns (ListEdgeTypesResponse);
  rpc DropEdgeType(DropEdgeTypeRequest) returns (DropEdgeTypeResponse);
  
  // Batch Operations
  rpc CreateBatch(CreateBatchRequest) returns (CreateBatchResponse);
  rpc AddBatchItems(AddBatchItemsRequest) returns (AddBatchItemsResponse);
  rpc ExecuteBatch(ExecuteBatchRequest) returns (ExecuteBatchResponse);
  rpc GetBatchStatus(GetBatchStatusRequest) returns (GetBatchStatusResponse);
  rpc CancelBatch(CancelBatchRequest) returns (CancelBatchResponse);
  
  // Statistics
  rpc GetSessionStatistics(GetSessionStatisticsRequest) returns (GetSessionStatisticsResponse);
  rpc GetQueryStatistics(GetQueryStatisticsRequest) returns (GetQueryStatisticsResponse);
  rpc GetDatabaseStatistics(GetDatabaseStatisticsRequest) returns (GetDatabaseStatisticsResponse);
  rpc GetSystemStatistics(GetSystemStatisticsRequest) returns (GetSystemStatisticsResponse);
  
  // Configuration
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  rpc ResetConfig(ResetConfigRequest) returns (ResetConfigResponse);
  
  // Custom Functions
  rpc RegisterFunction(RegisterFunctionRequest) returns (RegisterFunctionResponse);
  rpc UnregisterFunction(UnregisterFunctionRequest) returns (UnregisterFunctionResponse);
  rpc ListFunctions(ListFunctionsRequest) returns (ListFunctionsResponse);
  rpc GetFunctionInfo(GetFunctionInfoRequest) returns (GetFunctionInfoResponse);
  
  // Vector Index
  rpc CreateVectorIndex(CreateVectorIndexRequest) returns (CreateVectorIndexResponse);
  rpc GetVectorIndex(GetVectorIndexRequest) returns (GetVectorIndexResponse);
  rpc ListVectorIndexes(ListVectorIndexesRequest) returns (ListVectorIndexesResponse);
  rpc DropVectorIndex(DropVectorIndexRequest) returns (DropVectorIndexResponse);
  rpc SearchVector(SearchVectorRequest) returns (SearchVectorResponse);

  // Schema Versioning
  rpc GetVersionHistory(VersionHistoryRequest) returns (VersionHistoryResponse);
  rpc GetSchemaChanges(SchemaChangesRequest) returns (SchemaChangesResponse);
  rpc DetectBreakingChanges(BreakingChangesRequest) returns (BreakingChangesResponse);

  // Migration
  rpc MigratePlan(MigratePlanRequest) returns (MigratePlanResponse);
  rpc MigrateExecute(MigrateExecuteRequest) returns (MigrateExecuteResponse);
  rpc MigrateRollback(MigrateRollbackRequest) returns (MigrateRollbackResponse);
  rpc StreamMigrationProgress(StreamMigrationProgressRequest) returns (stream MigrationProgressEvent);
  rpc DryRunMigration(DryRunMigrationRequest) returns (DryRunMigrationResponse);
  rpc GetMigrationHistory(GetMigrationHistoryRequest) returns (GetMigrationHistoryResponse);
  rpc GetMigrationStatus(GetMigrationStatusRequest) returns (GetMigrationStatusResponse);

  // Cursor Queries
  rpc OpenCursor(OpenCursorRequest) returns (OpenCursorResponse);
  rpc FetchCursor(FetchCursorRequest) returns (FetchCursorResponse);
  rpc CloseCursor(CloseCursorRequest) returns (CloseCursorResponse);

  // Transaction Inspection
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc KillTransaction(KillTransactionRequest) returns (KillTransactionResponse);
  rpc GetTransactionMetrics(GetTransactionMetricsRequest) returns (GetTransactionMetricsResponse);

  // Sync Management
  rpc GetSyncStatus(GetSyncStatusRequest) returns (GetSyncStatusResponse);
  rpc RetryOutbox(RetryOutboxRequest) returns (RetryOutboxResponse);
  rpc GetOutboxDiagnostics(GetOutboxDiagnosticsRequest) returns (GetOutboxDiagnosticsResponse);
  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse);
  rpc RequeueDeadLetters(RequeueDeadLettersRequest) returns (RequeueDeadLettersResponse);
  rpc GetRetentionStatus(GetRetentionStatusRequest) returns (GetRetentionStatusResponse);
  rpc RunRetention(RunRetentionRequest) returns (RunRetentionResponse);

  // Import / Export
  rpc ImportData(ImportDataRequest) returns (ImportDataResponse);
  rpc GetImportStatus(GetImportStatusRequest) returns (GetImportStatusResponse);
  rpc ExportData(ExportDataRequest) returns (ExportDataResponse);

  // Fulltext
  rpc RebuildFulltextIndex(RebuildFulltextIndexRequest) returns (RebuildFulltextIndexResponse);
  rpc GetFulltextRebuildStatus(GetFulltextRebuildStatusRequest) returns (GetFulltextRebuildStatusResponse);
  rpc ClearFulltextIndex(ClearFulltextIndexRequest) returns (ClearFulltextIndexResponse);
  rpc ListInconsistentFulltext(ListInconsistentFulltextRequest) returns (ListInconsistentFulltextResponse);

  // Query Extras
  rpc ExplainQuery(ExplainQueryRequest) returns (ExplainQueryResponse);
  rpc ExecuteBatchQuery(ExecuteBatchQueryRequest) returns (ExecuteBatchQueryResponse);

  // Config Extras
  rpc GetConfigKey(GetConfigKeyRequest) returns (GetConfigKeyResponse);
  rpc BulkUpdateConfig(BulkUpdateConfigRequest) returns (BulkUpdateConfigResponse);

  // Batch Extras
  rpc DeleteBatch(DeleteBatchRequest) returns (DeleteBatchResponse);

  // Vector Extras
  rpc ScrollVector(ScrollVectorRequest) returns (ScrollVectorResponse);
  rpc GetVectorCount(GetVectorCountRequest) returns (GetVectorCountResponse);
  rpc RebuildVectorIndex(RebuildVectorIndexRequest) returns (RebuildVectorIndexResponse);
  rpc GetVectorRebuildStatus(GetVectorRebuildStatusRequest) returns (GetVectorRebuildStatusResponse);
  rpc ClearVectorIndex(ClearVectorIndexRequest) returns (ClearVectorIndexResponse);

  // Statistics Extras
  rpc GetOverviewStatistics(GetOverviewStatisticsRequest) returns (GetOverviewStatisticsResponse);
  rpc GetSearchStatistics(GetSearchStatisticsRequest) returns (GetSearchStatisticsResponse);
  rpc GetMigrationStatistics(GetMigrationStatisticsRequest) returns (GetMigrationStatisticsResponse);
  rpc GetFreezeStatistics(GetFreezeStatisticsRequest) returns (GetFreezeStatisticsResponse);
  rpc TriggerFreeze(TriggerFreezeRequest) returns (TriggerFreezeResponse);
  rpc GetQueryProfileDetail(GetQueryProfileDetailRequest) returns (GetQueryProfileDetailResponse);

  // Sync Degraded Ranges
  rpc ListDegradedRanges(ListDegradedRangesRequest) returns (ListDegradedRangesResponse);
  rpc ClearDegradedRange(ClearDegradedRangeRequest) returns (ClearDegradedRangeResponse);

  // Transaction Savepoints + Outbox
  rpc ListSavepoints(ListSavepointsRequest) returns (ListSavepointsResponse);
  rpc RetryTransactionOutbox(RetryTransactionOutboxRequest) returns (RetryTransactionOutboxResponse);

  // Vector Payload + Point
  rpc GetVectorPoint(GetVectorPointRequest) returns (GetVectorPointResponse);
  rpc SetVectorPayload(SetVectorPayloadRequest) returns (SetVectorPayloadResponse);
  rpc SetVectorPayloadFields(SetVectorPayloadFieldsRequest) returns (SetVectorPayloadFieldsResponse);
  rpc DeleteVectorPayload(DeleteVectorPayloadRequest) returns (DeleteVectorPayloadResponse);
}

// ============================================================
// Common Types
// ============================================================

message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string version = 2;
  int64 uptime_seconds = 3;
}

// ============================================================
// Authentication
// ============================================================

message LoginRequest {
  string username = 1;
  string password = 2;
  optional string space = 3;
}

message LoginResponse {
  bool success = 1;
  string session_id = 2;
  string error = 3;
}

message LogoutRequest {
  string session_id = 1;
}

message LogoutResponse {
  bool success = 1;
  string error = 2;
}

// ============================================================
// Session Management
// ============================================================

message CreateSessionRequest {
  string username = 1;
  string password = 2;
  optional string space = 3;
}

message CreateSessionResponse {
  bool success = 1;
  string session_id = 2;
  int32 space_id = 3;
  string error = 4;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  bool exists = 1;
  string session_id = 2;
  string username = 3;
  int32 space_id = 4;
  int64 created_at = 5;
  int64 last_accessed = 6;
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {
  bool success = 1;
  string error = 2;
}

// ============================================================
// Query Execution
// ============================================================

message ExecuteQueryRequest {
  string query = 1;
  optional string session_id = 2;
  optional string transaction_id = 3;
  optional QueryParameters parameters = 4;
}

message QueryParameters {
  map<string, Value> params = 1;
}

message ExecuteQueryResponse {
  bool success = 1;
  QueryResult result = 2;
  string error = 3;
  ExecutionMetadata metadata = 4;
}

message ValidateQueryRequest {
  string query = 1;
  string session_id = 2;
  bool need_estimate = 3;
}

message ValidateQueryResponse {
  bool valid = 1;
  string error = 2;
  repeated string parameter_names = 3;
  uint64 estimated_rows = 4;
  bool has_estimate = 5;
}

message QueryResult {
  repeated string column_names = 1;
  repeated Row rows = 2;
  map<string, string> plan_descriptions = 3;
}

message Row {
  repeated Value values = 1;
}

message Value {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    int64 timestamp_value = 6;
    double float_value = 7;
  }
}

message QueryResultChunk {
  repeated Row rows = 1;
  bool is_last = 2;
  repeated string column_names = 3;
}

message SchemaMessage {
  repeated string column_names = 1;
}

message StreamResponse {
  oneof payload {
    SchemaMessage schema = 1;
    QueryResultChunk data = 2;
  }
}

message ExecutionMetadata {
  uint64 rows_returned = 1;
  uint64 execution_time_ms = 2;
  uint64 rows_scanned = 3;
  map<string, uint64> custom_stats = 4;
}

// ============================================================
// Transaction Management
// ============================================================

message BeginTransactionRequest {
  optional string session_id = 1;
  TransactionOptions options = 2;
}

message TransactionOptions {
  bool read_only = 1;
  bool autocommit = 2;
  int32 isolation_level = 3;
  int64 timeout_ms = 4;
}

message BeginTransactionResponse {
  bool success = 1;
  string transaction_id = 2;
  string error = 3;
}

message CommitTransactionRequest {
  string transaction_id = 1;
  optional string session_id = 2;
}

message CommitTransactionResponse {
  bool success = 1;
  string error = 2;
}

message RollbackTransactionRequest {
  string transaction_id = 1;
  optional string session_id = 2;
}

message RollbackTransactionResponse {
  bool success = 1;
  string error = 2;
}

message CreateSavepointRequest {
  string transaction_id = 1;
  optional string session_id = 2;
  optional string name = 3;
}

message CreateSavepointResponse {
  bool success = 1;
  uint64 savepoint_id = 2;
  string error = 3;
}

message RollbackToSavepointRequest {
  string transaction_id = 1;
  uint64 savepoint_id = 2;
  optional string session_id = 3;
}

message RollbackToSavepointResponse {
  bool success = 1;
  string error = 2;
}

message ReleaseSavepointRequest {
  string transaction_id = 1;
  uint64 savepoint_id = 2;
  optional string session_id = 3;
}

message ReleaseSavepointResponse {
  bool success = 1;
  string error = 2;
}

// ============================================================
// Schema Management - Space
// ============================================================

message CreateSpaceRequest {
  string name = 1;
  SpaceOptions options = 2;
}

message SpaceOptions {
  int32 partition_num = 1;
  int32 replica_num = 2;
  string charset = 3;
  string collate = 4;
  bool vid_fixed_length = 5;
  int32 vid_length = 6;
}

message CreateSpaceResponse {
  bool success = 1;
  int32 space_id = 2;
  string error = 3;
}

message GetSpaceRequest {
  string name = 1;
}

message GetSpaceResponse {
  bool exists = 1;
  SpaceInfo space = 2;
  string error = 3;
}

message SpaceInfo {
  int32 id = 1;
  string name = 2;
  SpaceOptions options = 3;
  int64 created_at = 4;
}

message DropSpaceRequest {
  string name = 1;
  bool if_exists = 2;
}

message DropSpaceResponse {
  bool success = 1;
  string error = 2;
}

message ListSpacesRequest {}

message ListSpacesResponse {
  repeated SpaceInfo spaces = 1;
  string error = 2;
}

// ============================================================
// Schema Management - Tag
// ============================================================

message CreateTagRequest {
  string space_name = 1;
  string tag_name = 2;
  repeated PropertyDef properties = 3;
  optional TagOptions options = 4;
}

message PropertyDef {
  string name = 1;
  PropertyType type = 2;
  bool nullable = 3;
  optional Value default_value = 4;
  bool is_primary_key = 5;
}

enum PropertyType {
  PROPERTY_TYPE_BOOL = 0;
  PROPERTY_TYPE_INT = 1;
  PROPERTY_TYPE_FLOAT = 2;
  PROPERTY_TYPE_DOUBLE = 3;
  PROPERTY_TYPE_STRING = 4;
  PROPERTY_TYPE_TIMESTAMP = 5;
  PROPERTY_TYPE_DATE = 6;
  PROPERTY_TYPE_DATETIME = 7;
  PROPERTY_TYPE_VID = 8;
  PROPERTY_TYPE_EDGE = 9;
  PROPERTY_TYPE_TAG = 10;
  PROPERTY_TYPE_LIST = 11;
  PROPERTY_TYPE_SET = 12;
  PROPERTY_TYPE_MAP = 13;
}

message TagOptions {
  int64 ttl_seconds = 1;
  string ttl_column = 2;
}

message CreateTagResponse {
  bool success = 1;
  int32 tag_id = 2;
  string error = 3;
}

message GetTagRequest {
  string space_name = 1;
  string tag_name = 2;
}

message GetTagResponse {
  bool exists = 1;
  TagInfo tag = 2;
  string error = 3;
}

message TagInfo {
  int32 id = 1;
  string name = 2;
  repeated PropertyDef properties = 3;
  TagOptions options = 4;
  int64 created_at = 5;
}

message ListTagsRequest {
  string space_name = 1;
}

message ListTagsResponse {
  repeated TagInfo tags = 1;
  string error = 2;
}

message DropTagRequest {
  string space_name = 1;
  string tag_name = 2;
  bool if_exists = 3;
}

message DropTagResponse {
  bool success = 1;
  string error = 2;
}

// ============================================================
// Schema Management - Edge Type
// ============================================================

message CreateEdgeTypeRequest {
  string space_name = 1;
  string edge_type_name = 2;
  repeated PropertyDef properties = 3;
  optional EdgeTypeOptions options = 4;
}

message EdgeTypeOptions {
  bool directed = 1;
  int64 ttl_seconds = 2;
  string ttl_column = 3;
}

message CreateEdgeTypeResponse {
  bool success = 1;
  int32 edge_type_id = 2;
  string error = 3;
}

message GetEdgeTypeRequest {
  string space_name = 1;
  string edge_type_name = 2;
}

message GetEdgeTypeResponse {
  bool exists = 1;
  EdgeTypeInfo edge_type = 2;
  string error = 3;
}

message EdgeTypeInfo {
  int32 id = 1;
  string name = 2;
  repeated PropertyDef properties = 3;
  EdgeTypeOptions options = 4;
  int64 created_at = 5;
}

message ListEdgeTypesRequest {
  string space_name = 1;
}

message ListEdgeTypesResponse {
  repeated EdgeTypeInfo edge_types = 1;
  string error = 2;
}

message DropEdgeTypeRequest {
  string space_name = 1;
  string edge_type_name = 2;
  bool if_exists = 3;
}

message DropEdgeTypeResponse {
  bool success = 1;
  string error = 2;
}

// ============================================================
// Batch Operations
// ============================================================

message CreateBatchRequest {
  string space_name = 1;
  // Field 2 (batch options with atomic/timeout flags) was removed: the
  // batch executor is continue-on-error best-effort with no transaction or
  // timeout support, so no such options exist to set.
  reserved 2;
}

message CreateBatchResponse {
  bool success = 1;
  string batch_id = 2;
  string error = 3;
}

message AddBatchItemsRequest {
  string batch_id = 1;
  repeated BatchItem items = 2;
}

message BatchItem {
  oneof operation {
    InsertVertex insert_vertex = 1;
    InsertEdge insert_edge = 2;
    UpdateVertex update_vertex = 3;
    UpdateEdge update_edge = 4;
    DeleteVertex delete_vertex = 5;
    DeleteEdge delete_edge = 6;
  }
}

message InsertVertex {
  string tag_name = 1;
  string vid = 2;
  map<string, Value> properties = 3;
}

message InsertEdge {
  string edge_type = 1;
  string src = 2;
  string dst = 3;
  int64 ranking = 4;
  map<string, Value> properties = 5;
}

message UpdateVertex {
  string tag_name = 1;
  string vid = 2;
  map<string, Value> properties = 3;
}

message UpdateEdge {
  string edge_type = 1;
  string src = 2;
  string dst = 3;
  int64 ranking = 4;
  map<string, Value> properties = 5;
}

message DeleteVertex {
  string vid = 1;
  repeated string tag_names = 2;
}

message DeleteEdge {
  string edge_type = 1;
  string src = 2;
  string dst = 3;
  int64 ranking = 4;
}

message AddBatchItemsResponse {
  bool success = 1;
  int32 items_added = 2;
  string error = 3;
}

message ExecuteBatchRequest {
  string batch_id = 1;
}

message ExecuteBatchResponse {
  bool success = 1;
  repeated BatchResult results = 2;
  string error = 3;
  int64 vertices_inserted = 4;
  int64 edges_inserted = 5;
  int64 vertices_updated = 6;
  int64 edges_updated = 7;
  int64 vertices_deleted = 8;
  int64 edges_deleted = 9;
}

message BatchResult {
  bool success = 1;
  string error = 2;
}

message GetBatchStatusRequest {
  string batch_id = 1;
}

message GetBatchStatusResponse {
  string status = 1;  // PENDING, RUNNING, COMPLETED, FAILED, CANCELLED
  int32 total_items = 2;
  int32 processed_items = 3;
  int32 failed_items = 4;
  string error = 5;
}

message CancelBatchRequest {
  string batch_id = 1;
}

message CancelBatchResponse {
  bool success = 1;
  string error = 2;
}

// ============================================================
// Statistics
// ============================================================

message GetSessionStatisticsRequest {
  optional string session_id = 1;
}

message GetSessionStatisticsResponse {
  int64 active_sessions = 1;
  int64 total_sessions = 2;
  int64 failed_sessions = 3;
  map<string, int64> session_by_user = 4;
}

message GetQueryStatisticsRequest {
  optional string session_id = 1;
  optional int64 from_timestamp = 2;
  optional int64 to_timestamp = 3;
}

message GetQueryStatisticsResponse {
  int64 total_queries = 1;
  int64 slow_queries = 2;
  int64 failed_queries = 3;
  int64 avg_execution_time_ms = 4;
  int64 max_execution_time_ms = 5;
  repeated SlowQuery slow_query_list = 6;
}

message SlowQuery {
  string query = 1;
  int64 execution_time_ms = 2;
  int64 timestamp = 3;
  optional string session_id = 4;
}

message GetDatabaseStatisticsRequest {}

message GetDatabaseStatisticsResponse {
  int32 total_spaces = 1;
  int64 total_vertices = 2;
  int64 total_edges = 3;
  int64 storage_size_bytes = 4;
}

message GetSystemStatisticsRequest {}

message GetSystemStatisticsResponse {
  double cpu_usage_percent = 1;
  int64 memory_used_bytes = 2;
  int64 memory_total_bytes = 3;
  double disk_usage_percent = 4;
  int32 active_connections = 5;
  int64 network_rx_bytes = 6;
  int64 network_tx_bytes = 7;
}

// ============================================================
// Configuration
// ============================================================

message GetConfigRequest {}

message GetConfigResponse {
  map<string, ConfigSection> config = 1;
  string error = 2;
}

message ConfigSection {
  map<string, ConfigValue> values = 1;
}

message ConfigValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}

message UpdateConfigRequest {
  string section = 1;
  string key = 2;
  ConfigValue value = 3;
}

message UpdateConfigResponse {
  bool success = 1;
  string error = 2;
  bool requires_restart = 3;
  bool persisted = 4;
}

message ResetConfigRequest {
  string section = 1;
  string key = 2;
}

message ResetConfigResponse {
  bool success = 1;
  string error = 2;
  bool requires_restart = 3;
  bool persisted = 4;
}

// ============================================================
// Custom Functions
// ============================================================

message RegisterFunctionRequest {
  string name = 1;
  string function_type = 2;  // SCALAR, AGGREGATE, TABLE
  repeated string parameters = 3;
  string return_type = 4;
  string description = 5;
  // UDF source: local dynamic-library path loaded by the dynamic UDF
  // loader. Remote sources and embedded code (Lua/WASM) are not supported.
  string implementation = 6;
}

message RegisterFunctionResponse {
  bool success = 1;
  string function_id = 2;
  string error = 3;
}

message UnregisterFunctionRequest {
  string name = 1;
}

message UnregisterFunctionResponse {
  bool success = 1;
  string error = 2;
}

message ListFunctionsRequest {}

message ListFunctionsResponse {
  repeated FunctionInfo functions = 1;
  string error = 2;
}

message FunctionInfo {
  string name = 1;
  string function_type = 2;
  repeated string parameters = 3;
  string return_type = 4;
  string description = 5;
}

message GetFunctionInfoRequest {
  string name = 1;
}

message GetFunctionInfoResponse {
  bool exists = 1;
  FunctionInfo function = 2;
  string error = 3;
}

// ============================================================
// Vector Index
//
// Vector indexes are vertex-only: every `tag_name` field below is a vertex
// tag name, never an edge type name. Edge mutations never produce vector
// points (no edge scan source, no edge point-ID scheme), so there are no
// edge vector DTOs. A future edge-vector project would add them here.
// ============================================================

message CreateVectorIndexRequest {
  string space_name = 1;
  string tag_name = 2;
  string field_name = 3;
  VectorIndexOptions options = 4;
}

message VectorIndexOptions {
  int32 dimension = 1;
  DistanceMetric metric = 2;
  string index_type = 3;  // HNSW, FLAT, IVF, etc.
  map<string, string> parameters = 4;
}

enum DistanceMetric {
  DISTANCE_METRIC_COSINE = 0;
  DISTANCE_METRIC_L2 = 1;
  DISTANCE_METRIC_DOT = 2;
}

message CreateVectorIndexResponse {
  bool success = 1;
  string error = 2;
}

message GetVectorIndexRequest {
  string space_name = 1;
  string tag_name = 2;
  string field_name = 3;
}

message GetVectorIndexResponse {
  bool exists = 1;
  VectorIndexInfo index = 2;
  string error = 3;
}

message VectorIndexInfo {
  string space_name = 1;
  string tag_name = 2;
  string field_name = 3;
  VectorIndexOptions options = 4;
  int64 created_at = 5;
  int64 indexed_vectors = 6;
}

message ListVectorIndexesRequest {
  optional string space_name = 1;
}

message ListVectorIndexesResponse {
  repeated VectorIndexInfo indexes = 1;
  string error = 2;
}

message DropVectorIndexRequest {
  string space_name = 1;
  string tag_name = 2;
  string field_name = 3;
}

message DropVectorIndexResponse {
  bool success = 1;
  string error = 2;
}

message SearchVectorRequest {
  string space_name = 1;
  string tag_name = 2;
  string field_name = 3;
  repeated float vector = 4;
  int32 limit = 5;
  SearchFilter filter = 6;
  SearchOptions options = 7;
}

message SearchFilter {
  // JSON-encoded VectorFilter with the same shape as the HTTP search
  // filter (must/must_not/should/min_should over payload conditions).
  // There is no expression language; arbitrary strings fail to parse.
  string expression = 1;
}

message SearchOptions {
  int32 ef_search = 1;  // HNSW search parameter
  bool with_vector = 2;  // Whether to return vector data
}

message SearchVectorResponse {
  repeated VectorSearchResult results = 1;
  string error = 2;
}

message VectorSearchResult {
  string vid = 1;
  float score = 2;
  map<string, Value> properties = 3;
  repeated float vector = 4;  // If with_vector=true
}

// ============================================================
// Schema Versioning
// ============================================================

message VersionHistoryRequest {
  string space = 1;
  string label = 2;
  bool is_edge = 3;
}

message VersionHistoryResponse {
  repeated SchemaVersion versions = 1;
  string error = 2;
}

message SchemaVersion {
  uint64 version = 1;
  int64 timestamp_ms = 2;
  repeated PropertyChangeEvent changes = 3;
}

message PropertyChangeEvent {
  string change_type = 1;  // PropertyAdded, PropertyRemoved, PropertyRenamed, DataTypeChanged
  map<string, string> details = 2;
}

message SchemaChangesRequest {
  string space = 1;
  string label = 2;
  bool is_edge = 3;
