[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linkrs"
version = "0.1.0"
description = "Python ctypes binding for the Linkrs graph database (bring your own liblinkrs)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["."]
include = ["linkrs*"]

[tool.setuptools.package-data]
linkrs = ["py.typed"]
