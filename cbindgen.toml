# cbindgen Configuration File
# Generates include/linkrs.h from the C API module of crates/linkrs-api.
#
# Regeneration entry points:
#   cargo build --features c_api     (build.rs invokes cbindgen automatically)
#   cbindgen -c cbindgen.toml -o include/linkrs.h crates/linkrs-api   (manual)

language = "C"

# Prevent redefinition errors when the header is included twice.
include_guard = "LINKRS_H"

# Wrap declarations in extern "C" so C++ consumers get C linkage.
cpp_compat = true

autogen_warning = "/* Generated by cbindgen from crates/linkrs-api. DO NOT EDIT. */"

[parse]
# Follow `pub use` re-exports into dependency crates so that C types defined
# in linkrs-core (value types) are emitted with full definitions.
parse_deps = true
include = ["linkrs-core"]

[export]
# Export all items reachable from the C API entry points.
exclude = []

# The error code enums define the numeric contract of C entry point return
# values but appear in no signature, so they must be forced out.
include = ["linkrs_error_code_t", "linkrs_extended_error_code_t"]

[fn]
# Function naming style
rename_args = "None"

[struct]
# Struct naming style
rename_fields = "None"
derive_eq = true
derive_neq = true

[enum]
# Enum naming style
rename_variants = "None"
add_sentinel = false
