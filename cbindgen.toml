# cbindgen Configuration File
# Used to generate C header files from Rust code

language = "C"

[export]
# Export all public items
exclude = []

[fn]
# Function naming style
rename_args = "None"

[struct]
# Struct naming style
rename_fields = "None"
derive_eq = true
derive_neq = true

[enum]
# Enum naming style
rename_variants = "None"
add_sentinel = false

[defines]
# Preprocessor definitions
"target_os = windows" = "WINDOWS"
"target_os = linux" = "LINUX"
"target_os = macos" = "MACOS"
